<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Things & Plans</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PERSONAL PLANNER</p>
          <h1>Things & Plans</h1>
        </div>
        <button class="today-button" id="todayButton">Today</button>
      </header>

      <section class="layout">
        <aside class="sidebar">
          <section class="card add-card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">NEW</p>
                <h2>Add something</h2>
              </div>
            </div>

            <div class="tabs" role="tablist" aria-label="Add item type">
              <button class="tab active" data-tab="task" role="tab">Task</button>
              <button class="tab" data-tab="event" role="tab">Event</button>
            </div>

            <form id="taskForm" class="add-form">
              <label>
                Task
                <input id="taskTitle" name="title" required placeholder="e.g. Finish lab report" />
              </label>
              <div class="form-row">
                <label>
                  Category
                  <input id="taskCategory" name="category" list="categoryOptions" placeholder="School" />
                  <datalist id="categoryOptions"></datalist>
                </label>
                <label>
                  Plan to do
                  <input id="taskDate" name="date" type="date" />
                </label>
              </div>
              <div class="form-row">
                <label>
                  Soft due
                  <input id="taskSoftDueDate" name="softDueDate" type="date" />
                </label>
                <label>
                  Hard due
                  <input id="taskHardDueDate" name="hardDueDate" type="date" />
                </label>
              </div>
              <button class="primary-button" type="submit">Add task</button>
              <p class="form-help">Soft due is your target; hard due is the actual deadline. All dates are optional.</p>
            </form>

            <form id="eventForm" class="add-form hidden">
              <label>
                Event
                <input id="eventTitle" name="title" required placeholder="e.g. Team meeting" />
              </label>
              <div class="form-row">
                <label>
                  Date
                  <input id="eventDate" name="date" type="date" required />
                </label>
                <label>
                  Time
                  <input id="eventTime" name="time" type="time" />
                </label>
              </div>
              <label>
                Notes <span class="muted">(optional)</span>
                <textarea id="eventNotes" name="notes" rows="2" placeholder="Room, link, or anything useful"></textarea>
              </label>
              <button class="primary-button" type="submit">Add event</button>
            </form>
          </section>

          <section class="card task-card">
            <div class="section-heading task-heading">
              <div>
                <p class="eyebrow">TO-DO LIST</p>
                <h2>Tasks <span class="count" id="taskCount">0</span></h2>
              </div>
              <select id="categoryFilter" aria-label="Filter tasks by category">
                <option value="all">All categories</option>
              </select>
            </div>
            <div id="taskList" class="task-list"></div>
          </section>
        </aside>

        <section class="calendar-panel card">
          <div class="calendar-toolbar">
            <div class="month-controls">
              <button class="icon-button" id="previousMonth" aria-label="Previous month">‹</button>
              <h2 id="monthLabel">Month Year</h2>
              <button class="icon-button" id="nextMonth" aria-label="Next month">›</button>
            </div>
            <div class="legend" aria-label="Calendar legend">
              <span><i class="legend-dot task-dot"></i> task</span>
              <span><i class="legend-dot soft-due-dot"></i> soft due</span>
              <span><i class="legend-dot hard-due-dot"></i> hard due</span>
              <span><i class="legend-dot event-dot"></i> event</span>
            </div>
          </div>
          <div class="calendar-grid weekdays" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <div class="selected-date" id="selectedDateMessage">Select a day to add a task or event.</div>
        </section>
      </section>
    </main>

    <template id="taskTemplate">
      <article class="task-item">
        <button class="check-button" aria-label="Mark task complete"></button>
        <div class="task-content">
          <div class="task-title-row">
            <span class="task-title"></span>
            <button class="delete-button" aria-label="Delete task">×</button>
          </div>
          <div class="task-meta">
            <span class="category-pill"></span>
            <span class="task-schedule"></span>
            <span class="soft-due-badge hidden"></span>
            <span class="hard-due-badge hidden"></span>
          </div>
          <div class="schedule-control hidden">
            <label>Plan <input class="plan-date-input" type="date" aria-label="Plan task date" /></label>
            <label>Soft <input class="soft-date-input" type="date" aria-label="Soft due date" /></label>
            <label>Hard <input class="hard-date-input" type="date" aria-label="Hard due date" /></label>
            <button class="small-button">Save</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
